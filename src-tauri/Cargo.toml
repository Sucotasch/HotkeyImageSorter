[package]
name = "hotkey-image-sorter"
version = "0.1.2"
description = "HotkeyImageSorter - fast keyboard-driven image sorting"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
image = { version = "0.25", features = ["avif", "avif-native"] }
turbojpeg = "1.5"
png = "0.17"
kamadak-exif = "0.5"
arboard = "3.4"
directories = "5"
trash = "5.2.5"

[dev-dependencies]
tempfile = "3"

# Vendored dav1d-sys with a patched build.rs that disables the bundled
# tools/tests (their resource compiler breaks when the build path contains
# spaces on Windows) and checks command exit codes.
[patch.crates-io]
dav1d-sys = { path = "vendor/dav1d-sys" }
