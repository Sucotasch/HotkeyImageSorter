name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, check, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          # dav1d is built from source by the vendored dav1d-sys (AVIF decode);
          # libjpeg-turbo is built from source by turbojpeg-sys (lossless JPEG
          # rotation) and needs cmake + nasm
          sudo apt-get install -y meson ninja-build nasm pkg-config cmake
      # Pinned to the dev machine's Rust so CI doesn't turn red every time a
      # new clippy release adds lints under -D warnings. Bump this together
      # with the local toolchain.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    name: Frontend (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
